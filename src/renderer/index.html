<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>Suigen</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <button class="particle-btn" data-type="electron" title="Electron">e&#x207B;</button>
      <button class="particle-btn" data-type="proton" title="Proton">p&#x207A;</button>
      <button class="particle-btn" data-type="neutron" title="Neutron">n&#x2070;</button>
      <button class="particle-btn" data-type="photon" title="Photon">&#x03B3;</button>
      <select id="photon-energy" title="Energy of placed photons">
        <option value="10.1987" title="1s &#x2192; 2p">10.2 eV</option>
        <option value="12.0874" title="1s &#x2192; 3p">12.09 eV</option>
        <option value="12.7484" title="1s &#x2192; 4p">12.75 eV</option>
        <option value="1.8887" title="2p &#x2192; 3s">1.89 eV</option>
        <option value="5" title="Matches no transition">5.0 eV</option>
      </select>
    </div>
    <div id="viewport"></div>
    <div id="info-panel"></div>
    <div id="timeline">
      <button id="btn-reset" title="Reset to the start" aria-label="Reset">&#x23EE;</button>
      <button id="btn-step-back" title="Step back" aria-label="Step back">&#x00AB;</button>
      <button id="btn-play" title="Play/Pause" aria-label="Play">&#x25B6;</button>
      <button id="btn-step-fwd" title="Step forward" aria-label="Step forward">&#x00BB;</button>
      <input id="scrubber" type="range" min="0" max="1" step="any" value="0" title="Drag to move through the scene" aria-label="Scene position" />
      <label>Speed: <input id="speed" type="range" min="0.1" max="10" step="0.1" value="1" /></label>
      <span id="time-display">t = 0 fs</span>
    </div>
  </div>
  <script type="module" src="app.ts"></script>
</body>
</html>
